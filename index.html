    <style>
        :root {
            --primary-gold: #f3c623;
            --gold-glow: rgba(243, 198, 35, 0.4);
            --bg-dark: #030712;
            --card-bg: rgba(15, 23, 42, 0.65);
            --border-glow: rgba(243, 198, 35, 0.25);
            --text-main: #f8fafc;
            --font-km: 'Kantumruy Pro', sans-serif;
            --font-en: 'Outfit', sans-serif;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            height: 100vh;
            overflow: hidden;
            background-color: var(--bg-dark);
            font-family: var(--font-km);
            color: var(--text-main);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* Futuristic Background Background Elements */
        .cyber-bg {
            position: fixed;
            inset: 0;
            background: radial-gradient(circle at 50% 30%, #0f172a 0%, #030712 100%);
            z-index: 0;
        }

        .cyber-grid {
            position: fixed;
            inset: 0;
            background-image: 
                linear-gradient(to right, rgba(255, 255, 255, 0.03) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(255, 255, 255, 0.03) 1px, transparent 1px);
            background-size: 40px 40px;
            z-index: 1;
            pointer-events: none;
            mask-image: radial-gradient(circle at center, black 40%, transparent 80%);
        }

        /* Animated Glowing Orbs */
        .orb {
            position: fixed;
            border-radius: 50%;
            filter: blur(90px);
            opacity: 0.35;
            z-index: 0;
            animation: floatOrb 18s ease-in-out infinite alternate;
        }

        .orb-1 {
            width: 350px;
            height: 350px;
            background: #d4af37;
            top: -100px;
            right: -80px;
        }

        .orb-2 {
            width: 450px;
            height: 450px;
            background: #3b82f6;
            bottom: -150px;
            left: -100px;
            animation-delay: -5s;
        }

        @keyframes floatOrb {
            0% { transform: translate(0, 0) scale(1); }
            50% { transform: translate(40px, 50px) scale(1.1); }
            100% { transform: translate(-30px, -20px) scale(0.95); }
        }

        /* Main Container */
        .glass-panel {
            position: relative;
            z-index: 20;
            width: 100%;
            max-width: 440px;
            padding: 0 20px;
            text-align: center;
        }

        /* Status Header Badge */
        .header-badge {
            margin-bottom: 24px;
            animation: fadeSlideDown 0.8s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .badge {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            background: rgba(15, 23, 42, 0.75);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            padding: 12px 24px;
            border-radius: 100px;
            border: 1px solid var(--border-glow);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5), inset 0 1px 0 rgba(255, 255, 255, 0.1);
        }

        .badge-icon {
            width: 8px;
            height: 8px;
            background: var(--primary-gold);
            border-radius: 50%;
            box-shadow: 0 0 10px var(--primary-gold);
            animation: pulseGlow 1.5s infinite;
        }

        @keyframes pulseGlow {
            0%, 100% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.5); opacity: 0.5; }
        }

        .badge-text {
            font-size: 13.5px;
            font-weight: 500;
            color: #e2e8f0;
        }

        .badge-text .status-user { color: var(--primary-gold); font-weight: 700; }
        .badge-text .status-days { color: #4ade80; font-weight: 700; }
        .badge-text .status-expired { color: #f87171; font-weight: 700; }
        .badge-text .status-inactive { color: #ef4444; font-weight: 700; }

        /* Main Action Card */
        .card {
            background: var(--card-bg);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border-radius: 32px;
            padding: 36px 28px;
            border: 1px solid var(--border-glow);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7);
            animation: fadeSlideUp 0.8s cubic-bezier(0.16, 1, 0.3, 1);
            transition: transform 0.3s ease, border-color 0.3s ease;
        }

        .card:hover {
            border-color: rgba(243, 198, 35, 0.45);
        }

        /* Modern Futuristic Buttons */
        .button-group {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .btn {
            position: relative;
            width: 100%;
            padding: 16px 20px;
            border: 1px solid rgba(243, 198, 35, 0.25);
            border-radius: 20px;
            font-size: 16px;
            font-weight: 600;
            font-family: var(--font-km);
            cursor: pointer;
            background: linear-gradient(135deg, rgba(30, 41, 59, 0.8) 0%, rgba(15, 23, 42, 0.9) 100%);
            color: #f1f5f9;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .btn::after {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(90deg, transparent, rgba(243, 198, 35, 0.15), transparent);
            transform: translateX(-100%);
            transition: transform 0.6s ease;
        }

        .btn:hover::after {
            transform: translateX(100%);
        }

        .btn:hover {
            transform: translateY(-2px);
            border-color: var(--primary-gold);
            box-shadow: 0 8px 25px rgba(243, 198, 35, 0.25);
            color: #fff;
        }

        .btn:active {
            transform: translateY(1px);
        }

        /* Status Top Badge */
        .status-badge {
            position: fixed;
            top: 16px;
            right: 16px;
            background: rgba(15, 23, 42, 0.8);
            backdrop-filter: blur(10px);
            padding: 6px 14px;
            border-radius: 30px;
            font-size: 11px;
            font-weight: 600;
            font-family: var(--font-en);
            z-index: 100;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .status-badge.online { color: #4ade80; border-color: rgba(74, 222, 128, 0.3); }
        .status-badge.offline { color: #fbbf24; border-color: rgba(251, 191, 36, 0.3); }

        /* Login Overlay Modern Redesign */
        .login-overlay {
            position: fixed;
            inset: 0;
            background: rgba(3, 7, 18, 0.85);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            z-index: 9999;
            display: none;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .login-overlay.active {
            display: flex;
        }

        .login-box {
            background: rgba(15, 23, 42, 0.8);
            border-radius: 36px;
            padding: 40px 28px;
            border: 1px solid var(--border-glow);
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.8), inset 0 1px 0 rgba(255, 255, 255, 0.1);
            max-width: 380px;
            width: 100%;
            text-align: center;
            animation: zoomIn 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .login-logo {
            width: 70px;
            height: 70px;
            margin: 0 auto 16px;
            background: radial-gradient(circle, rgba(243, 198, 35, 0.15) 0%, transparent 70%);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 32px;
            border: 1px solid var(--border-glow);
            cursor: pointer;
            transition: transform 0.3s ease;
        }

        .login-logo:active { transform: scale(0.9); }

        .login-title {
            color: var(--text-main);
            font-size: 26px;
            font-weight: 800;
            font-family: var(--font-en);
            letter-spacing: 2px;
            margin-bottom: 2px;
        }

        .login-subtitle {
            color: var(--primary-gold);
            font-size: 11px;
            font-family: var(--font-en);
            letter-spacing: 2px;
            text-transform: uppercase;
            margin-bottom: 16px;
            opacity: 0.8;
        }

        .login-expiry {
            font-size: 13px;
            color: #94a3b8;
            margin-bottom: 20px;
            padding: 10px 14px;
            border-radius: 14px;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.05);
            min-height: 42px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .login-input-group {
            position: relative;
            margin-bottom: 14px;
        }

        .login-input {
            width: 100%;
            padding: 14px 18px;
            padding-right: 48px;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            color: var(--text-main);
            font-size: 14px;
            font-family: var(--font-km);
            transition: all 0.3s ease;
            outline: none;
        }

        .login-input:focus {
            border-color: var(--primary-gold);
            background: rgba(255, 255, 255, 0.07);
            box-shadow: 0 0 15px rgba(243, 198, 35, 0.15);
        }

        .toggle-password {
            position: absolute;
            right: 14px;
            top: 50%;
            transform: translateY(-50%);
            background: transparent;
            border: none;
            color: #64748b;
            font-size: 18px;
            cursor: pointer;
            transition: color 0.3s ease;
        }

        .toggle-password:hover { color: var(--primary-gold); }

        .login-btn {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, var(--primary-gold), #d97706);
            border: none;
            border-radius: 16px;
            color: #030712;
            font-size: 15px;
            font-weight: 700;
            font-family: var(--font-km);
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(243, 198, 35, 0.3);
            margin-top: 6px;
        }

        .login-btn:hover {
            transform: translateY(-1px);
            box-shadow: 0 6px 20px rgba(243, 198, 35, 0.45);
        }

        .login-telegram-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 8px 16px;
            background: rgba(56, 189, 248, 0.1);
            border: 1px solid rgba(56, 189, 248, 0.25);
            border-radius: 20px;
            color: #38bdf8;
            font-size: 12px;
            font-family: var(--font-en);
            cursor: pointer;
            margin-top: 16px;
            transition: all 0.3s ease;
            text-decoration: none;
        }

        .login-telegram-btn:hover {
            background: rgba(56, 189, 248, 0.2);
            border-color: rgba(56, 189, 248, 0.5);
            transform: translateY(-1px);
        }

        .login-device-info {
            color: #64748b;
            font-size: 11px;
            margin-top: 16px;
            padding-top: 16px;
            border-top: 1px solid rgba(255, 255, 255, 0.05);
        }

        .login-error {
            color: #f87171;
            font-size: 13px;
            margin-top: 10px;
            display: none;
            padding: 8px;
            border-radius: 10px;
            background: rgba(239, 68, 68, 0.1);
            border: 1px solid rgba(239, 68, 68, 0.2);
        }

        .login-error.show { display: block; }

        .install-prompt {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: linear-gradient(135deg, var(--primary-gold), #d97706);
            color: #030712;
            padding: 12px 24px;
            border-radius: 50px;
            font-size: 13px;
            font-weight: 700;
            cursor: pointer;
            z-index: 100;
            border: none;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.4);
            display: none;
            white-space: nowrap;
        }

        /* Animations */
        @keyframes fadeSlideUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes fadeSlideDown {
            from { opacity: 0; transform: translateY(-20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes zoomIn {
            from { opacity: 0; transform: scale(0.95); }
            to { opacity: 1; transform: scale(1); }
        }

        .login-loading {
            display: none;
            align-items: center;
            justify-content: center;
            gap: 8px;
            margin-top: 10px;
            color: var(--primary-gold);
            font-size: 13px;
        }

        .login-loading.active { display: flex; }

        .spinner {
            width: 16px;
            height: 16px;
            border: 2px solid rgba(243, 198, 35, 0.2);
            border-top-color: var(--primary-gold);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin { to { transform: rotate(360deg); } }

        /* Notification Popup */
        .update-notification {
            position: fixed;
            bottom: 80px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(15, 23, 42, 0.9);
            border: 1px solid var(--primary-gold);
            color: #fff;
            padding: 10px 20px;
            border-radius: 30px;
            font-size: 12px;
            z-index: 1000;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
            animation: fadeInOut 3s ease forwards;
            white-space: nowrap;
        }

        @keyframes fadeInOut {
            0% { opacity: 0; transform: translate(-50%, 10px); }
            15%, 85% { opacity: 1; transform: translate(-50%, 0); }
            100% { opacity: 0; transform: translate(-50%, -10px); }
        }
    </style>
</head>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyA-RvOzR03Ic4HefKdBycXYIK7AZyjcVn4",

        };
        
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        firebase.auth().signInAnonymously().catch((error) => console.error('Auth error:', error));

        function updateStatusBadge() {
            const badge = document.getElementById('statusBadge');
            if (navigator.onLine) {
                badge.textContent = '● Online';
                badge.className = 'status-badge online';
            } else {
                badge.textContent = '● Offline';
                badge.className = 'status-badge offline';
            }
        }

        function showUpdateNotification(title, message) {
            const oldNotif = document.querySelector('.update-notification');
            if (oldNotif) oldNotif.remove();
            
            const notification = document.createElement('div');
            notification.className = 'update-notification';
            notification.textContent = `✨ ${title}: ${message}`;
            document.body.appendChild(notification);
            setTimeout(() => notification.remove(), 3000);
        }

        function getDaysRemainingFromDate(expiryDateStr) {
            const expiryDate = new Date(expiryDateStr);
            const now = new Date();
            const diffTime = expiryDate.getTime() - now.getTime();
            return Math.ceil(diffTime / (1000 * 60 * 60 * 24));
        }

        function formatDate(dateStr) {
            const date = new Date(dateStr);
            const day = date.getDate().toString().padStart(2, '0');
            const month = (date.getMonth() + 1).toString().padStart(2, '0');
            return `${day}/${month}/${date.getFullYear()}`;
        }

        function checkUserStatus(userData) {
            if (!userData) return { expired: true, message: 'អ្នកគ្មានគណនីសម្រាប់ប្រើប្រាស់ទេ!' };
            if (userData.status === 'inactive') return { expired: true, message: 'គណនីត្រូវបានហាមឃាត់!' };
            if (userData.status === 'expired' || !userData.expiryDate) return { expired: true, message: 'គណនីផុតកំណត់!' };
            
            const daysRemaining = getDaysRemainingFromDate(userData.expiryDate);
            if (daysRemaining < 0) return { expired: true, message: 'គណនីផុតកំណត់!' };
            
            return { expired: false, daysRemaining, expiryDate: userData.expiryDate };
        }

        let userCodes = { metfone: '', cellcard: '', smart: '' };
        let userExists = { metfone: false, cellcard: false, smart: false };

        function updateAccountStatus(user) {
            const statusEl = document.getElementById('accountStatusValue');
            if (!statusEl) return;
            if (!user) {
                statusEl.textContent = '👤 សូមចូលប្រើ';
                return;
            }
            
            const result = checkUserStatus(user);
            if (result.expired) {
                statusEl.innerHTML = `⛔ <span class="status-inactive">${result.message}</span>`;
                return;
            }

            const days = result.daysRemaining;
            const expiryFormatted = formatDate(result.expiryDate);
            let daysClass = days <= 3 ? 'status-expired' : 'status-days';
            let daysText = days === 0 ? '⚠️ ផុតកំណត់ថ្ងៃនេះ' : `${days} ថ្ងៃ`;

            statusEl.innerHTML = `
                👤 <span class="status-user">${user.uid}</span> | 
                📅 ${expiryFormatted} | 
                <span class="${daysClass}">${daysText}</span>
            `;
        }

        function setUserSession(user) {
            userCodes = { metfone: '', cellcard: '', smart: '' };
            userExists = { metfone: false, cellcard: false, smart: false };

            if (user.links) {
                ['metfone', 'cellcard', 'smart'].forEach(type => {
                    if (user.links[type]) {
                        userCodes[type] = user.links[type];
                        userExists[type] = true;
                    }
                });
            }

            document.getElementById('loginOverlay').classList.remove('active');
            showUpdateNotification('ជោគជ័យ', 'បានចូលប្រើប្រាស់ដោយជោគជ័យ');
            updateAccountStatus(user);
        }

        function openV2Box(type) {
            if (!userExists[type] || !userCodes[type]) {
                showUpdateNotification('កំហុស', 'អ្នកមិនបានទិញគម្រោងនេះទេ');
                return;
            }
            const content = userCodes[type];
            if (!content.startsWith('http://') && !content.startsWith('https://')) {
                showUpdateNotification('កំហុស', 'កូដមិនត្រឹមត្រូវ');
                return;
            }
            const v2boxUrl = `v2box://install-sub?url=${encodeURIComponent(content)}&name=${encodeURIComponent(type.toUpperCase())}`;
            window.location.href = v2boxUrl;
        }

        function getDeviceFingerprint() {
            let fp = localStorage.getItem('device_fingerprint');
            if (fp && fp.startsWith('FP_')) return fp;

            const str = [navigator.userAgent, screen.width + 'x' + screen.height, navigator.language].join('|||');
            let hash = 0;
            for (let i = 0; i < str.length; i++) hash = ((hash << 5) - hash) + str.charCodeAt(i);
            fp = 'FP_' + Math.abs(hash).toString(16).padStart(8, '0');
            localStorage.setItem('device_fingerprint', fp);
            return fp;
        }

        async function initLogin() {
            const usernameInput = document.getElementById('loginUsername');
            const passwordInput = document.getElementById('loginPassword');
            const btn = document.getElementById('loginBtn');
            const error = document.getElementById('loginError');
            const loading = document.getElementById('loginLoading');

            async function handleLogin() {
                const username = usernameInput.value.trim();
                const password = passwordInput.value.trim();

                error.classList.remove('show');
                if (!username || !password) {
                    error.textContent = 'សូមបញ្ចូល Username និង ពាក្យសម្ងាត់';
                    error.classList.add('show');
                    return;
                }

                loading.classList.add('active');
                btn.disabled = true;

                try {
                    const snapshot = await db.ref('users/' + username).once('value');
                    const userData = snapshot.val();

                    if (!userData || userData.password !== password) throw new Error('Username ឬ ពាក្យសម្ងាត់មិនត្រឹមត្រូវ');
                    if (userData.fingerprint !== getDeviceFingerprint()) throw new Error('ឧបករណ៍នេះមិនត្រូវបានអនុញ្ញាត');

                    const statusCheck = checkUserStatus(userData);
                    if (statusCheck.expired) throw new Error(statusCheck.message);

                    setUserSession({
                        uid: username,
                        links: userData.links || {},
                        expiryDate: userData.expiryDate,
                        status: userData.status
                    });
                } catch (err) {
                    error.textContent = '❌ ' + err.message;
                    error.classList.add('show');
                }

                loading.classList.remove('active');
                btn.disabled = false;
            }

            btn.addEventListener('click', handleLogin);
            passwordInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') handleLogin(); });
        }

        // Toggle Password Visibility
        document.getElementById('togglePasswordBtn').addEventListener('click', function() {
            const input = document.getElementById('loginPassword');
            input.type = input.type === 'password' ? 'text' : 'password';
            this.textContent = input.type === 'password' ? '👁️' : '🙈';
        });

        window.addEventListener('online', updateStatusBadge);
        window.addEventListener('offline', updateStatusBadge);
        
        setTimeout(initLogin, 100);
        updateAccountStatus(null);
        updateStatusBadge();
    </script>
</body>
</html>
