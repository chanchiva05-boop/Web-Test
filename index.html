<!DOCTYPE html>
<html lang="km">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>𝕊𝕂𝕐ℕ𝔼𝕋</title>
    <link rel="apple-touch-icon" href="teva.png">
    <link rel="icon" type="image/png" sizes="32x32" href="teva.png">
    <link rel="icon" type="image/png" sizes="192x192" href="teva.png">
    <meta name="theme-color" content="#0a0a2a">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="TEVA">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="application-name" content="TEVA">
    <meta name="msapplication-TileColor" content="#0a0a2a">
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js">
    </script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js">
    </script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js">
    </script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            background: #0a0a1a;
            font-family: 'Inter', 'Khmer OS Battambang', sans-serif;
            overflow: hidden;
            color: #fff;
        }

        /* Base Layers */
        .bg-layer {
            position: fixed;
            inset: 0;
            z-index: 0;
        }

        .bg-layer .gradient {
            width: 100%;
            height: 100%;
            background: radial-gradient(ellipse at 20% 50%, rgba(25, 35, 80, 0.9), rgba(5, 5, 20, 0.98));
        }

        .bg-layer .grid-pattern {
            position: absolute;
            inset: 0;
            background-image:
                radial-gradient(circle at 1px 1px, rgba(212, 175, 55, 0.05) 1px, transparent 0);
            background-size: 40px 40px;
            opacity: 0.5;
        }

        .bg-layer .glow-orbs {
            position: absolute;
            inset: 0;
            overflow: hidden;
        }

        .glow-orbs .orb {
            position: absolute;
            border-radius: 50%;
            filter: blur(100px);
            opacity: 0.3;
            animation: floatOrb 25s ease-in-out infinite alternate;
        }

        .glow-orbs .orb-1 {
            width: 500px;
            height: 500px;
            background: radial-gradient(circle, rgba(212, 175, 55, 0.3), transparent 70%);
            top: -200px;
            right: -100px;
            animation-delay: 0s;
        }

        .glow-orbs .orb-2 {
            width: 600px;
            height: 600px;
            background: radial-gradient(circle, rgba(80, 120, 255, 0.2), transparent 70%);
            bottom: -250px;
            left: -150px;
            animation-delay: -8s;
        }

        .glow-orbs .orb-3 {
            width: 350px;
            height: 350px;
            background: radial-gradient(circle, rgba(245, 220, 120, 0.2), transparent 70%);
            top: 40%;
            left: 10%;
            animation-delay: -15s;
        }

        @keyframes floatOrb {
            0% {
                transform: translate(0, 0) scale(1);
            }
            100% {
                transform: translate(40px, -30px) scale(1.1);
            }
        }

        /* Particles */
        .particles {
            position: fixed;
            inset: 0;
            z-index: 1;
            pointer-events: none;
            overflow: hidden;
        }

        .particle {
            position: absolute;
            width: 3px;
            height: 3px;
            background: rgba(212, 175, 55, 0.2);
            border-radius: 50%;
            animation: floatParticle 15s linear infinite;
        }

        @keyframes floatParticle {
            0% {
                transform: translateY(100vh) translateX(0) scale(0);
                opacity: 0;
            }
            10% {
                opacity: 1;
                transform: translateY(90vh) translateX(10px) scale(1);
            }
            90% {
                opacity: 1;
            }
            100% {
                transform: translateY(-10vh) translateX(-20px) scale(0);
                opacity: 0;
            }
        }

        /* Birds */
        .birds {
            position: fixed;
            inset: 0;
            z-index: 2;
            pointer-events: none;
        }

        .bird {
            position: absolute;
            width: 50px;
            height: 30px;
            opacity: 0.5;
            animation: flyBird 30s linear infinite;
        }

        .bird::before,
        .bird::after {
            content: '';
            position: absolute;
            top: 50%;
            width: 20px;
            height: 12px;
            background: rgba(255, 245, 200, 0.7);
            border-radius: 50%;
            transform-origin: center;
            animation: wingFlap 0.6s ease-in-out infinite alternate;
        }

        .bird::before {
            left: 5px;
            transform: rotate(-20deg);
        }
        .bird::after {
            right: 5px;
            transform: rotate(20deg);
            animation-delay: 0.3s;
        }

        .bird .body {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 25px;
            height: 12px;
            background: rgba(255, 245, 200, 0.8);
            border-radius: 50%;
        }

        .bird .tail {
            position: absolute;
            right: -5px;
            top: 50%;
            transform: translateY(-50%);
            width: 12px;
            height: 8px;
            background: rgba(255, 235, 180, 0.7);
            border-radius: 50% 0 0 50%;
            transform: rotate(15deg);
        }

        @keyframes wingFlap {
            0% {
                transform: rotate(-30deg) scaleY(1);
            }
            100% {
                transform: rotate(-60deg) scaleY(0.7);
            }
        }

        @keyframes flyBird {
            0% {
                transform: translateX(-20vw) translateY(0);
            }
            100% {
                transform: translateX(120vw) translateY(-20px);
            }
        }

        .bird:nth-child(1) {
            top: 15%;
            animation-duration: 28s;
            animation-delay: 0s;
        }
        .bird:nth-child(2) {
            top: 25%;
            animation-duration: 32s;
            animation-delay: 4s;
        }
        .bird:nth-child(3) {
            top: 10%;
            animation-duration: 25s;
            animation-delay: 8s;
        }
        .bird:nth-child(4) {
            top: 20%;
            animation-duration: 35s;
            animation-delay: 2s;
        }
        .bird:nth-child(5) {
            top: 30%;
            animation-duration: 30s;
            animation-delay: 6s;
        }

        /* Mountains */
        .mountains {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 40%;
            z-index: 3;
            pointer-events: none;
        }

        .mountain {
            position: absolute;
            bottom: 0;
            background: linear-gradient(180deg, rgba(10, 12, 30, 0.9), rgba(0, 0, 0, 0.8));
            clip-path: polygon(50% 0%, 0% 100%, 100% 100%);
        }

        .mountain-1 {
            left: 0%;
            width: 30%;
            height: 80%;
            opacity: 0.4;
        }
        .mountain-2 {
            left: 20%;
            width: 35%;
            height: 95%;
            opacity: 0.5;
        }
        .mountain-3 {
            left: 50%;
            width: 28%;
            height: 70%;
            opacity: 0.35;
        }
        .mountain-4 {
            left: 72%;
            width: 30%;
            height: 85%;
            opacity: 0.45;
        }

        .mist {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 40%;
            background: linear-gradient(to top, rgba(255, 255, 245, 0.06), transparent);
            filter: blur(60px);
            animation: mistMove 20s ease-in-out infinite alternate;
        }

        @keyframes mistMove {
            0% {
                opacity: 0.4;
                transform: translateX(-3%);
            }
            100% {
                opacity: 0.8;
                transform: translateX(3%);
            }
        }

        /* Status Badge */
        .status-badge {
            position: fixed;
            top: 16px;
            right: 16px;
            z-index: 100;
            padding: 6px 16px;
            border-radius: 30px;
            font-size: 11px;
            font-weight: 600;
            letter-spacing: 0.5px;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            pointer-events: none;
            transition: all 0.3s ease;
        }

        .status-badge.online {
            color: #4ade80;
            border-color: rgba(74, 222, 128, 0.2);
        }
        .status-badge.offline {
            color: #fbbf24;
            border-color: rgba(251, 191, 36, 0.2);
        }

        /* Main Content */
        .main-container {
            position: relative;
            z-index: 10;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }

        .content {
            width: 100%;
            max-width: 440px;
            text-align: center;
        }

        /* Header Badge */
        .header-badge {
            display: inline-flex;
            align-items: center;
            gap: 12px;
            padding: 12px 28px;
            background: rgba(255, 255, 255, 0.04);
            backdrop-filter: blur(20px);
            border-radius: 100px;
            border: 1px solid rgba(212, 175, 55, 0.15);
            margin-bottom: 32px;
            transition: all 0.3s ease;
            animation: fadeUp 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
            opacity: 0;
            transform: translateY(20px);
        }

        .header-badge:hover {
            border-color: rgba(212, 175, 55, 0.3);
            transform: scale(1.02);
        }

        .badge-dot {
            width: 8px;
            height: 8px;
            background: #d4af37;
            border-radius: 50%;
            box-shadow: 0 0 20px rgba(212, 175, 55, 0.4);
            animation: pulseDot 2s ease-in-out infinite;
            flex-shrink: 0;
        }

        @keyframes pulseDot {
            0%,
            100% {
                opacity: 0.6;
                transform: scale(1);
            }
            50% {
                opacity: 1;
                transform: scale(1.3);
            }
        }

        .badge-text {
            font-size: 14px;
            font-weight: 500;
            color: rgba(255, 255, 255, 0.8);
            letter-spacing: 0.3px;
        }

        .badge-text .user {
            color: #d4af37;
            font-weight: 700;
        }
        .badge-text .days {
            color: #4ade80;
            font-weight: 700;
        }
        .badge-text .expired {
            color: #ff6b6b;
            font-weight: 700;
        }
        .badge-text .inactive {
            color: #ff4444;
            font-weight: 700;
        }

        /* Main Card */
        .card {
            background: rgba(10, 15, 30, 0.6);
            backdrop-filter: blur(30px);
            border-radius: 48px;
            padding: 40px 28px;
            border: 1px solid rgba(212, 175, 55, 0.1);
            box-shadow: 0 40px 80px rgba(0, 0, 0, 0.5), inset 0 1px 0 rgba(255, 255, 255, 0.04);
            animation: fadeUp 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
            opacity: 0;
            transform: translateY(20px);
            animation-delay: 0.15s;
            transition: all 0.4s ease;
        }

        .card:hover {
            border-color: rgba(212, 175, 55, 0.2);
            box-shadow: 0 50px 90px rgba(0, 0, 0, 0.6), inset 0 1px 0 rgba(255, 255, 255, 0.06);
            transform: translateY(-4px);
        }

        @keyframes fadeUp {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .card-title {
            font-size: 12px;
            font-weight: 600;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: rgba(212, 175, 55, 0.5);
            margin-bottom: 24px;
        }

        .btn-group {
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .btn {
            position: relative;
            padding: 18px 24px;
            border: none;
            border-radius: 40px;
            font-family: inherit;
            font-size: 16px;
            font-weight: 600;
            color: #e8e2c7;
            background: linear-gradient(135deg, rgba(30, 40, 60, 0.8), rgba(15, 20, 35, 0.9));
            border: 1px solid rgba(212, 175, 55, 0.15);
            cursor: pointer;
            transition: all 0.35s cubic-bezier(0.16, 1, 0.3, 1);
            overflow: hidden;
            letter-spacing: 0.5px;
        }

        .btn .shine {
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(212, 175, 55, 0.08), transparent);
            transition: left 0.6s ease;
        }

        .btn:hover .shine {
            left: 100%;
        }

        .btn:hover {
            transform: translateY(-2px) scale(1.01);
            border-color: rgba(212, 175, 55, 0.4);
            box-shadow: 0 12px 30px rgba(212, 175, 55, 0.1);
            background: linear-gradient(135deg, rgba(40, 50, 70, 0.9), rgba(20, 28, 45, 0.95));
        }

        .btn:active {
            transform: translateY(1px) scale(0.99);
        }

        .btn .glow {
            position: absolute;
            inset: 0;
            border-radius: 40px;
            background: radial-gradient(circle at 30% 50%, rgba(212, 175, 55, 0.1), transparent 70%);
            opacity: 0;
            transition: opacity 0.3s ease;
            pointer-events: none;
        }

        .btn:hover .glow {
            opacity: 1;
        }

        .btn .icon {
            margin-right: 10px;
            font-size: 18px;
            display: inline-block;
        }

        /* Card Footer */
        .card-footer {
            display: flex;
            justify-content: center;
            gap: 8px;
            margin-top: 28px;
            padding-top: 20px;
            border-top: 1px solid rgba(255, 255, 255, 0.04);
        }

        .card-footer .dot {
            width: 5px;
            height: 5px;
            border-radius: 50%;
            background: rgba(212, 175, 55, 0.2);
            transition: all 0.3s ease;
        }

        .card:hover .dot {
            background: rgba(212, 175, 55, 0.5);
        }

        /* Install Button */
        .install-btn {
            position: fixed;
            bottom: 24px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 100;
            padding: 12px 28px;
            border: none;
            border-radius: 60px;
            font-family: inherit;
            font-size: 14px;
            font-weight: 600;
            color: #0a0a1a;
            background: linear-gradient(135deg, #d4af37, #b8922a);
            cursor: pointer;
            box-shadow: 0 8px 30px rgba(212, 175, 55, 0.3);
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
            display: none;
            align-items: center;
            gap: 10px;
            letter-spacing: 0.3px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .install-btn:hover {
            transform: translateX(-50%) translateY(-3px);
            box-shadow: 0 12px 40px rgba(212, 175, 55, 0.4);
            background: linear-gradient(135deg, #e5c458, #d4af37);
        }

        .install-btn:active {
            transform: translateX(-50%) translateY(1px);
        }

        .install-btn .icon {
            font-size: 18px;
            animation: bounceIcon 1.5s ease-in-out infinite;
        }

        @keyframes bounceIcon {
            0%,
            100% {
                transform: translateY(0);
            }
            50% {
                transform: translateY(-3px);
            }
        }

        /* Notification */
        .notification {
            position: fixed;
            bottom: 100px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 1000;
            padding: 10px 24px;
            border-radius: 40px;
            font-size: 13px;
            font-weight: 500;
            font-family: inherit;
            background: linear-gradient(135deg, #d4af37, #b8922a);
            color: #0a0a1a;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.3);
            animation: notifFade 3s ease forwards;
            white-space: nowrap;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        @keyframes notifFade {
            0% {
                opacity: 0;
                transform: translateX(-50%) translateY(10px);
            }
            15% {
                opacity: 1;
                transform: translateX(-50%) translateY(0);
            }
            85% {
                opacity: 1;
                transform: translateX(-50%) translateY(0);
            }
            100% {
                opacity: 0;
                transform: translateX(-50%) translateY(-10px);
            }
        }

        /* Login Overlay */
        .login-overlay {
            position: fixed;
            inset: 0;
            z-index: 9999;
            background: rgba(5, 5, 20, 0.97);
            backdrop-filter: blur(30px);
            display: none;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .login-overlay.active {
            display: flex;
        }

        .login-box {
            width: 100%;
            max-width: 400px;
            padding: 44px 32px;
            background: rgba(10, 15, 30, 0.8);
            backdrop-filter: blur(30px);
            border-radius: 48px;
            border: 1px solid rgba(212, 175, 55, 0.1);
            box-shadow: 0 40px 80px rgba(0, 0, 0, 0.5);
            animation: fadeUp 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
            text-align: center;
        }

        .login-logo {
            width: 72px;
            height: 72px;
            margin: 0 auto 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 36px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(212, 175, 55, 0.1), transparent 70%);
            border: 2px solid rgba(212, 175, 55, 0.1);
            transition: all 0.3s ease;
            cursor: default;
        }

        .login-title {
            font-size: 28px;
            font-weight: 800;
            color: #f0e9cf;
            letter-spacing: 2px;
            margin-bottom: 2px;
        }

        .login-subtitle {
            font-size: 12px;
            font-weight: 500;
            letter-spacing: 3px;
            text-transform: uppercase;
            color: rgba(212, 175, 55, 0.4);
            margin-bottom: 20px;
        }

        .login-status {
            padding: 10px 14px;
            border-radius: 12px;
            font-size: 13px;
            font-weight: 500;
            margin-bottom: 20px;
            min-height: 44px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(255, 255, 255, 0.04);
            transition: all 0.3s ease;
            color: rgba(255, 255, 255, 0.5);
        }

        .login-status.loading {
            color: rgba(212, 175, 55, 0.6);
            animation: pulseLoading 1s ease-in-out infinite;
        }
        .login-status.warning {
            color: #fbbf24;
            background: rgba(251, 191, 36, 0.06);
            border-color: rgba(251, 191, 36, 0.1);
        }
        .login-status.success {
            color: #4ade80;
            background: rgba(74, 222, 128, 0.05);
            border-color: rgba(74, 222, 128, 0.08);
        }
        .login-status.error {
            color: #ff6b6b;
            background: rgba(255, 107, 107, 0.06);
            border-color: rgba(255, 107, 107, 0.1);
        }
        .login-status.denied {
            color: #ff4444;
            background: rgba(255, 68, 68, 0.08);
            border-color: rgba(255, 68, 68, 0.15);
        }

        @keyframes pulseLoading {
            0%,
            100% {
                opacity: 0.6;
            }
            50% {
                opacity: 1;
            }
        }

        .login-input-group {
            position: relative;
            margin-bottom: 16px;
        }

        .login-input {
            width: 100%;
            padding: 16px 20px;
            padding-right: 50px;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 30px;
            color: #f0e9cf;
            font-size: 15px;
            font-family: inherit;
            outline: none;
            transition: all 0.3s ease;
        }

        .login-input:focus {
            border-color: rgba(212, 175, 55, 0.3);
            background: rgba(255, 255, 255, 0.06);
            box-shadow: 0 0 30px rgba(212, 175, 55, 0.05);
        }

        .login-input::placeholder {
            color: rgba(255, 255, 255, 0.2);
        }

        .toggle-password {
            position: absolute;
            right: 16px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            color: rgba(255, 255, 255, 0.3);
            font-size: 18px;
            cursor: pointer;
            padding: 4px;
            transition: color 0.3s ease;
        }

        .toggle-password:hover {
            color: #d4af37;
        }

        .login-btn {
            width: 100%;
            padding: 16px;
            border: none;
            border-radius: 30px;
            font-family: inherit;
            font-size: 16px;
            font-weight: 700;
            color: #0a0a1a;
            background: linear-gradient(135deg, #d4af37, #b8922a);
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
            box-shadow: 0 4px 20px rgba(212, 175, 55, 0.2);
            letter-spacing: 0.5px;
        }

        .login-btn:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 8px 30px rgba(212, 175, 55, 0.3);
        }

        .login-btn:active:not(:disabled) {
            transform: translateY(1px);
        }

        .login-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .login-loading {
            display: none;
            align-items: center;
            justify-content: center;
            gap: 12px;
            margin-top: 14px;
            color: rgba(255, 255, 255, 0.4);
            font-size: 13px;
        }

        .login-loading.active {
            display: flex;
        }

        .spinner {
            width: 18px;
            height: 18px;
            border: 2px solid rgba(212, 175, 55, 0.15);
            border-top-color: #d4af37;
            border-radius: 50%;
            animation: spin 0.7s linear infinite;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        .login-error {
            margin-top: 12px;
            padding: 10px 14px;
            border-radius: 12px;
            font-size: 14px;
            font-weight: 600;
            color: #ff6b6b;
            background: rgba(255, 107, 107, 0.06);
            border: 1px solid rgba(255, 107, 107, 0.1);
            opacity: 0;
            transform: translateY(-4px);
            transition: all 0.3s ease;
            min-height: 42px;
        }

        .login-error.show {
            opacity: 1;
            transform: translateY(0);
        }

        .login-telegram {
            margin: 8px auto 4px;
            padding: 6px 18px;
            border: 1px solid rgba(0, 136, 204, 0.15);
            border-radius: 30px;
            background: rgba(0, 136, 204, 0.05);
            color: rgba(255, 255, 255, 0.6);
            font-family: inherit;
            font-size: 12px;

    <script>

        firebase.auth().signInAnonymously()

        // ============================================================

        let userCodes = { metfone: '', cellcard: '', smart: '' };

        // ============================================================

        // ============================================================
        function showNotification(title, message) {
            document.querySelectorAll('.notification').forEach(el => el.remove());
            const el = document.createElement('div');
            el.className = 'notification';
            el.textContent = `✨ ${title}: ${message}`;
            document.body.appendChild(el);
            setTimeout(() => el.remove(), 3000);
        }

        function formatDate(dateStr) {
            const d = new Date(dateStr);
            return `${String(d.getDate()).padStart(2,'0')}/${String(d.getMonth()+1).padStart(2,'0')}/${d.getFullYear()}`;
        }

        function getDaysRemaining(expiryDateStr) {
            const diff = new Date(expiryDateStr).getTime() - Date.now();
            return Math.ceil(diff / (1000 * 60 * 60 * 24));
        }

        function checkUserStatus(user) {
            if (!user) return { expired: true, message: 'គ្មានគណនី' };
            if (user.status === 'inactive') return { expired: true, message: 'ត្រូវបានហាមឃាត់', reason: 'inactive' };
            if (user.status === 'expired') return { expired: true, message: 'គណនីបានផុតកំណត់', reason: 'expired' };
            if (!user.expiryDate) return { expired: true, message: 'គណនីបានផុតកំណត់' };
            const days = getDaysRemaining(user.expiryDate);
            if (days < 0) return { expired: true, message: 'គណនីបានផុតកំណត់' };
            return { expired: false, daysRemaining: days, expiryDate: user.expiryDate };
        }

        function updateAccountStatus(user) {
            const el = document.getElementById('accountStatusValue');
            if (!el) return;
            if (!user) { el.textContent = '👤 សូមចូលប្រើ'; return; }
            const result = checkUserStatus(user);
            if (result.expired) {
                el.innerHTML = `⛔ <span class="inactive">${result.message}</span>`;
                return;
            }
            const days = result.daysRemaining;
            const expiry = formatDate(result.expiryDate);
            let daysHtml = '';
            if (days === 0) daysHtml = `<span class="expired">⚠️ ផុតកំណត់ថ្ងៃនេះ</span>`;
            else if (days <= 3) daysHtml = `<span class="expired">⚠️ ${days} ថ្ងៃ</span>`;
            else if (days <= 7) daysHtml = `<span class="expired">⚠️ ${days} ថ្ងៃ</span>`;
            else daysHtml = `<span class="days">${days} ថ្ងៃ</span>`;
            el.innerHTML = `👤 <span class="user">${user.uid}</span> &nbsp;|&nbsp; 📅 ${expiry} &nbsp;|&nbsp; ${daysHtml}`;
        }

        function setUserSession(user) {
            currentUser = user;
            userCodes = { metfone: '', cellcard: '', smart: '' };
            userExists = { metfone: false, cellcard: false, smart: false };
            if (user.links) {
                if (user.links.metfone) { userCodes.metfone = user.links.metfone;
                    userExists.metfone = true; }
                if (user.links.cellcard) { userCodes.cellcard = user.links.cellcard;
                    userExists.cellcard = true; }
                if (user.links.smart) { userCodes.smart = user.links.smart;
                    userExists.smart = true; }
            }
            isLoggedIn = true;
            sessionStorage.setItem('teva_logged_in', 'true');
            sessionStorage.setItem('teva_password', user.password || '');
            document.getElementById('loginOverlay').classList.remove('active');
            showNotification('ជោគជ័យ', 'បានចូលប្រើប្រាស់ដោយជោគជ័យ');
            updateAccountStatus(user);
        }

        // ============================================================
        // OPEN V2BOX
        // ============================================================
        function openV2Box(type) {
            if (!userExists[type]) {
                showNotification('កំហុស', 'អ្នកមិនបានទិញគម្រោង INTERNET នេះទេ');
                return;
            }
            let content = userCodes[type] || '';
            const nameMap = { metfone: 'METFONE', cellcard: 'CELLCARD', smart: 'SMART' };
            const name = nameMap[type] || type.toUpperCase();
            if (!content || content === '' || content === 'undefined' || content === 'null') {
                showNotification('កំហុស', 'អ្នកមិនបានទិញគម្រោង INTERNET នេះទេ');
                return;
            }
            if (!content.startsWith('http://') && !content.startsWith('https://')) {
                showNotification('កំហុស', 'កូដមិនត្រឹមត្រូវ (ត្រូវការ URL)');
                return;
            }
            const url = `v2box://install-sub?url=${encodeURIComponent(content)}&name=${encodeURIComponent(name)}`;
            window.location.href = url;
            let opened = false;
            const onOpen = () => { opened = true;
                document.removeEventListener('visibilitychange', onOpen);
                window.removeEventListener('blur', onOpen); };
            document.addEventListener('visibilitychange', onOpen);
            window.addEventListener('blur', onOpen);
            setTimeout(() => {
                if (!opened) {
                    const isAndroid = /android/i.test(navigator.userAgent);
                    const isIOS = /iphone|ipad|ipod/i.test(navigator.userAgent);
                    if (isAndroid) window.location.href =
                    'https://play.google.com/store/apps/details?id=dev.hexasoftware.v2box';
                    else if (isIOS) window.location.href = 'https://apps.apple.com/app/v2box/id6446814670';
                }
            }, 2500);
        }

        // ============================================================
        // PARTICLES
        // ============================================================
        (function createParticles() {
            const container = document.getElementById('particles');
            for (let i = 0; i < 50; i++) {
                const p = document.createElement('div');
                p.className = 'particle';
                const size = Math.random() * 3 + 1;

                p.style.animationDelay = Math.random() * 15 + 's';

                container.appendChild(p);

        })();

        // ============================================================
        // STATUS BADGE
        // ============================================================
        function updateStatusBadge() {
            const el = document.getElementById('statusBadge');
            if (navigator.onLine) { el.textContent = '● Online';
                el.className = 'status-badge online'; } else { el.textContent = '● Offline';
                el.className = 'status-badge offline'; }
        }
        window.addEventListener('online', () => { updateStatusBadge();
            showNotification('បណ្តាញ', 'កំពុងភ្ជាប់អ៊ីនធឺណិត'); });
        window.addEventListener('offline', () => { updateStatusBadge();
            showNotification('បណ្តាញ', 'បានផ្តាច់អ៊ីនធឺណិត'); });

        // ============================================================
        // DEVICE FINGERPRINT
        // ============================================================
        function getDeviceFingerprint() {
            let fp = localStorage.getItem('device_fingerprint');
            if (fp && fp.startsWith('FP_')) return fp;
            const components = [
                navigator.userAgent,
                screen.width + 'x' + screen.height,
                screen.colorDepth,
                navigator.hardwareConcurrency || 0,
                navigator.platform,
                navigator.language,
                new Date().getTimezoneOffset()
            ];
            try {
                const canvas = document.createElement('canvas');
                canvas.width = 200;
                canvas.height = 50;
                const ctx = canvas.getContext('2d');
                ctx.textBaseline = 'top';
                ctx.font = '14px Arial';
                ctx.fillStyle = '#f60';
                ctx.fillRect(125, 1, 62, 20);
                ctx.fillStyle = '#069';
                ctx.fillText('TEVA', 2, 15);
                ctx.fillStyle = 'rgba(102,204,0,0.7)';
                ctx.fillText('SECURE', 4, 17);
                components.push(canvas.toDataURL());
            } catch (_) {}
            let hash = 0;
            const str = components.join('|||');
            for (let i = 0; i < str.length; i++) {
                hash = ((hash << 5) - hash) + str.charCodeAt(i);
                hash = hash & hash;
            }
            fp = 'FP_' + Math.abs(hash).toString(16).padStart(8, '0');
            localStorage.setItem('device_fingerprint', fp);
            return fp;
        }
        const deviceFingerprint = getDeviceFingerprint();

            const existing = document.getElementById('fpDisplay');

            document.body.appendChild(div);

        function copyFingerprint() {
            const fp = getDeviceFingerprint();
            navigator.clipboard.writeText(fp).then(() => showNotification('✅', 'ចម្លងដោយជោគជ័យ!'))
                .catch(() => alert('⚠️ សូមចម្លងដោយដៃ: ' + fp));
        }

        // ============================================================
        // PASSWORD TOGGLE
        // ============================================================
        const toggleBtn = document.getElementById('togglePasswordBtn');
        const passInput = document.getElementById('loginPassword');
        let passVisible = false;
        toggleBtn.addEventListener('click', () => {
            passVisible = !passVisible;
            passInput.type = passVisible ? 'text' : 'password';
            toggleBtn.textContent = passVisible ? '🙈' : '👁️';

        // ============================================================
        // LOGIN SYSTEM
        // ============================================================
        async function initLogin() {
            const overlay = document.getElementById('loginOverlay');
            const usernameInput = document.getElementById('loginUsername');
            const passwordInput = document.getElementById('loginPassword');
            const btn = document.getElementById('loginBtn');
            const errorEl = document.getElementById('loginError');
            const loadingEl = document.getElementById('loginLoading');
            const statusEl = document.getElementById('loginStatus');
            const statusText = document.getElementById('statusText');

            // Clear session
            sessionStorage.removeItem('teva_logged_in');
            sessionStorage.removeItem('teva_password');
            isLoggedIn = false;
            overlay.classList.add('active');
            statusText.textContent = '👤 បញ្ចូល Username និង Password';
            statusEl.className = 'login-status';

            // Clear errors on input
            usernameInput.addEventListener('input', () => {
                errorEl.classList.remove('show');
                errorEl.textContent = '';
            });
            passwordInput.addEventListener('input', () => {
                errorEl.classList.remove('show');
                errorEl.textContent = '';
            });

            async function handleLogin() {
                const username = usernameInput.value.trim();
                const password = passwordInput.value.trim();
                errorEl.classList.remove('show');
                errorEl.textContent = '';

                if (!username) { errorEl.textContent = 'សូមបញ្ចូល Username';
                    errorEl.classList.add('show');
                    usernameInput.focus(); return; }
                if (!password) { errorEl.textContent = 'សូមបញ្ចូលពាក្យសម្ងាត់';
                    errorEl.classList.add('show');
                    passwordInput.focus(); return; }
                if (!navigator.onLine) { errorEl.textContent = '❌ ត្រូវការអ៊ីនធឺណិត';
                    errorEl.classList.add('show'); return; }

                loadingEl.classList.add('active');
                btn.disabled = true;
                statusText.textContent = '⏳ កំពុងផ្ទៀងផ្ទាត់...';
                statusEl.className = 'login-status loading';

                try {
                    const snapshot = await db.ref('users/' + username).once('value');
                    const userData = snapshot.val();
                    if (!userData) throw new Error('Username មិនត្រឹមត្រូវ');
                    if (userData.password !== password) throw new Error('ពាក្យសម្ងាត់មិនត្រឹមត្រូវ');
                    const currentFp = getDeviceFingerprint();
                    if (userData.fingerprint !== currentFp) throw new Error('ឧបករណ៍នេះមិនត្រូវបានអនុញ្ញាត');
                    const statusCheck = checkUserStatus(userData);
                    if (statusCheck.expired) throw new Error(statusCheck.message);
                    localStorage.setItem('teva_user_uid', username);
                    localStorage.setItem('teva_logged_in', 'true');
                    const user = {
                        uid: username,
                        links: userData.links || { metfone: '', cellcard: '', smart: '' },
                        expiryDate: userData.expiryDate,
                        status: userData.status,
                        password: password
                    };
                    setUserSession(user);
                } catch (err) {
                    errorEl.textContent = '❌ ' + err.message;
                    errorEl.classList.add('show');
                    statusText.textContent = '❌ ' + err.message;
                    statusEl.className = 'login-status error';
                    passwordInput.value = '';
                    setTimeout(() => passwordInput.focus(), 100);
                }
                loadingEl.classList.remove('active');
                btn.disabled = false;
            }

            btn.addEventListener('click', handleLogin);
            passwordInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') handleLogin(); });
            usernameInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') { e.preventDefault();
                    passwordInput.focus(); } });
            setTimeout(() => usernameInput.focus(), 400);
        }

        // ============================================================
        // PWA MANIFEST
        // ============================================================
        (function createManifest() {
            const LOGO = "teva.png";
            const data = {
                name: "𝕊𝕂𝕐ℕ𝔼𝕋",
                short_name: "𝕊𝕂𝕐ℕ𝔼𝕋",
                description: "𝕊𝕂𝕐ℕ𝔼𝕋🟢",
                start_url: ".",
                display: "standalone",
                orientation: "portrait",
                theme_color: "#0a0a2a",
                background_color: "#0a0a2a",
                icons: [
                    { src: LOGO, sizes: "192x192", type: "image/png", purpose: "any maskable" },
                    { src: LOGO, sizes: "512x512", type: "image/png", purpose: "any maskable" }
                ]
            };
            const blob = new Blob([JSON.stringify(data)], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const link = document.createElement('link');
            link.rel = 'manifest';
            link.href = url;
            document.head.appendChild(link);
        })();

        // ============================================================
        // INSTALL PWA
        // ============================================================
        let deferredPrompt;
        const installBtn = document.getElementById('installBtn');
        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
            deferredPrompt = e;
            installBtn.style.display = 'flex';
        });
        installBtn.addEventListener('click', async () => {
            if (deferredPrompt) {
                deferredPrompt.prompt();
                const { outcome } = await deferredPrompt.userChoice;
                deferredPrompt = null;
                installBtn.style.display = 'none';
            }
        });
        window.addEventListener('appinstalled', () => {
            installBtn.style.display = 'none';
            deferredPrompt = null;
            showNotification('ជោគជ័យ', 'បានដំឡើងកម្មវិធី');
        });
        if (window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true) {
            installBtn.style.display = 'none';
        }

        // ============================================================
        // INIT
        // ============================================================
        setTimeout(initLogin, 100);
        updateAccountStatus(null);
        updateStatusBadge();

        console.log('🚀 SKYNET v3 - Redesigned with elegance');
    </script>
</body>
